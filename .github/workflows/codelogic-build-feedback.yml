# codelogic-build-feedback
name: CodeLogic Build Feedback

on:
  push:
    branches:
      - master
      - 'codelogic/**'

jobs:
  build:
    name: Build and report to CodeLogic
    runs-on: ubuntu-22.04
    env:
      NO_COLOR: "1"
      TERM: "dumb"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Build
        run: |
          set -o pipefail
          mvn -B license:format clean install -DskipTests -Dpkg.skip=true 2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Send CodeLogic Build Info
        if: always()
        uses: CodeLogicIncEngineering/codelogic-send-build-info-github-action@v1.0.2
        with:
          codelogic_host: ${{ vars.CODELOGIC_HOST }}
          agent_uuid: ${{ vars.AGENT_UUID }}
          agent_password: ${{ secrets.AGENT_PASSWORD }}
          job_name: ${{ github.workflow }}
          build_number: ${{ github.run_number }}
          build_status: ${{ job.status }}
          pipeline_system: GitHub Actions
          log_file: /github/workspace/build.log
